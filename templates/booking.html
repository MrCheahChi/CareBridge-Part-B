<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | CareBridge Hospital</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="booking-card">
        <h1>Book an Appointment</h1>

        <p>
            Enter the patient details and select an appointment slot.
            Appointments must be more than seven days from today.
        </p>

        {% if error %}
            <div class="message error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="patient_id">Patient ID</label>

                <input
                    type="text"
                    id="patient_id"
                    name="patient_id"
                    value="{{ patient_id }}"
                    pattern="[YNyn]-[0-9]{3}"
                    placeholder="Example: Y-001"
                    title="Use the format Y-001 or N-001."
                    required
                >

                <small class="form-help">
                    Enter the ID generated during patient registration.
                </small>
            </div>

            <div class="form-group">
                <label for="department">Department</label>

                <select
                    id="department"
                    name="department"
                    required
                >
                    <option value="">Select a department</option>

                    <option
                        value="GP"
                        {% if department == "GP" %}selected{% endif %}
                    >
                        GP
                    </option>

                    <option
                        value="Specialist"
                        {% if department == "Specialist" %}selected{% endif %}
                    >
                        Specialist
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="appointment_date">
                    Appointment Date
                </label>

                <input
                    type="date"
                    id="appointment_date"
                    name="appointment_date"
                    min="{{ minimum_date }}"
                    value="{{ appointment_text }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="appointment_time">
                    Preferred Appointment Time
                </label>

                <select
                    id="appointment_time"
                    name="appointment_time"
                    required
                >
                    <option value="">Select a time</option>
                    <option value="09:00" {% if appointment_time == "09:00" %}selected{% endif %}>9:00 AM</option>
                    <option value="11:00" {% if appointment_time == "11:00" %}selected{% endif %}>11:00 AM</option>
                    <option value="14:00" {% if appointment_time == "14:00" %}selected{% endif %}>2:00 PM</option>
                    <option value="16:00" {% if appointment_time == "16:00" %}selected{% endif %}>4:00 PM</option>
                </select>
            </div>

            <button type="submit">
                Confirm Appointment
            </button>
        </form>

        <a class="back-link" href="{{ url_for('home') }}">
            Return to Home
        </a>
    </main>
</body>
</html>
