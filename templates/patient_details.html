<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration Details</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <div class="container">
        <header>
            <h1>CareBridge Hospital</h1>
            <p>Hospital Management System</p>
        </header>

        <main class="card">
            <div class="message success">
                <h2>Registration Successful</h2>
                <p>Your patient registration has been completed.</p>
            </div>

            <div class="patient-details">
                <h3>Patient Details</h3>

                <p>
                    <strong>Patient ID:</strong>
                    {{ patient.id }}
                </p>

                <p>
                    <strong>Patient Name:</strong>
                    {{ patient.name }}
                </p>

                <p>
                    <strong>Age:</strong>
                    {{ patient.age }}
                </p>

                <p>
                    <strong>Priority:</strong>
                    {{ patient.priority }}
                </p>

            </div>

            <a class="button-link"
               href="{{ url_for('book_appointment') }}">
                Continue to Book Appointment
            </a>

            <a class="back-link"
               href="{{ url_for('start_new_patient') }}">
                Start Over
            </a>
        </main>
    </div>
</body>
</html>
